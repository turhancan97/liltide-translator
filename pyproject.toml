[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "liltide"
version = "0.1.0.dev0"
description = "Live Polish-to-English captions with local audio capture and Azure Speech"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "SoundCard>=0.4.5,<0.5",
  "numpy>=1.26,<3",
  "soxr>=0.5,<2",
  "azure-cognitiveservices-speech>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "markdown-it-py>=4.2,<5"]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
liltide = "liltide.cli:app"
liltide-gui = "liltide.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liltide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
