<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">Liltide — live captions across languages</title>
  <desc id="desc">Dark banner with the original blue and red waveform, Liltide wordmark, and paired caption-line illustration. Polish to English, CLI and desktop.</desc>
