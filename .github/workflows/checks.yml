name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen
  AZURE_SPEECH_KEY: ""
  AZURE_SPEECH_REGION: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Offline tests and build (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - name: Install project and build tools
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -e ".[dev,gui]" "hatchling==1.33.0"
          python -m pip check
      - name: Verify GUI dependency is available
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([])"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m hatchling build
      - name: Check installed wheel CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          liltide --help

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install application and isolated audit tool
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip==26.2.2"
          .venv/bin/python -m pip install -e ".[dev,gui]"
          .venv/bin/python -m pip list --format=freeze --exclude liltide > "$RUNNER_TEMP/application-requirements.txt"
          python -m venv "$RUNNER_TEMP/audit-tools"
          "$RUNNER_TEMP/audit-tools/bin/python" -m pip install --upgrade "pip==26.2.2"
          "$RUNNER_TEMP/audit-tools/bin/python" -m pip install "pip-audit==2.10.1"
      - name: Audit installed application distributions
        run: >-
          "$RUNNER_TEMP/audit-tools/bin/pip-audit"
          --requirement "$RUNNER_TEMP/application-requirements.txt"
          --no-deps --disable-pip --strict --progress-spinner off

  secrets:
    name: Committed secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan checked-out commits with redacted output
        # Explicitly include HEAD: pull_request uses a synthetic merge commit.
        # Ignore repository-supplied scanner configs/allowlists.
        run: |
          cat > "$RUNNER_TEMP/gitleaks-default.toml" <<'CONFIG'
          [extend]
          useDefault = true
          CONFIG
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact=100 \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --log-opts="--all HEAD" .

  documentation:
    name: Local documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install "markdown-it-py==4.2.0"
      - run: python scripts/check_docs.py
